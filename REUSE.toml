# The license of every file, in the machine-readable form of REUSE
# (https://reuse.software); the Lint workflow checks it.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Trkal and HACSAutodarts contributors", "2026 Dennis Otto", "Contributors to Autodarts"]
SPDX-License-Identifier = "MIT"

# The frames of the Granboard in granboard.py are those that two MIT-licensed apps
# read, gran-app by sobassy and granboard-app by bastiennoel93; see
# docs/decisions/0024-granboard-over-home-assistant-bluetooth.md.
[[annotations]]
path = "custom_components/autodarts/granboard.py"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2024 Sobassy", "2025 bastiennoel93"]
SPDX-License-Identifier = "MIT"

# The brand artwork of Autodarts, with the favicon of the website that is rendered
# from it, identifies the supported product. It belongs to its owner and is not
# covered by the MIT license; see the README and docs/branding/README.md.
[[annotations]]
path = ["custom_components/autodarts/brand/**", "docs/branding/*.svg", "docs/branding/favicon.png"]
precedence = "override"
SPDX-FileCopyrightText = "Autodarts"
SPDX-License-Identifier = "LicenseRef-Autodarts-Brand"
