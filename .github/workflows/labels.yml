name: Labels

# Creates and updates the repository's labels from .github/labels.toml. It never
# deletes a label; one that is missing from the file is reported in the summary.

on:
  push:
    branches: [main]
    paths:
      - .github/labels.toml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would change
        type: boolean
        default: false

permissions: {}

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize labels
    if: github.repository == 'Dennis-Otto/ha-autodarts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create and update the labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: python3 .github/scripts/issue_assistant.py sync-labels
