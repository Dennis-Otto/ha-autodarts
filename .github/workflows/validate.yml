name: Integration validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 4 * * 3"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the license in the proposed revision
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          license_text = Path("LICENSE").read_text()
          if not license_text.startswith("MIT License\n") or "Copyright (c)" not in license_text:
              raise SystemExit("The MIT license and copyright attribution must be preserved.")
          terms = license_text[license_text.index("Permission is hereby granted"):]
          digest = hashlib.sha256(" ".join(terms.split()).encode()).hexdigest()
          # Canonical MIT grant and disclaimer, independent of copyright names and wrapping.
          if digest != "fe2a9817987f862eaced948f0468c7f51d2fedfc48c5c505b246a49a3870e9a5":
              raise SystemExit("The MIT license terms differ from the declared license.")
          PY
      - name: Validate HACS integration metadata
        # The action runs HACS' moving ghcr.io/hacs/action:main image on purpose: it
        # always validates against the rules HACS applies to new submissions today.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hassfest also runs Home Assistant's current image, for the same reason.
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
