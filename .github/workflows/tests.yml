name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install hash-pinned test dependencies
        run: pip install --require-hashes -r requirements-test.txt
      - name: Run tests with a coverage gate
        # pytest-xdist runs the tests on every core; pytest-cov combines the
        # branch coverage of all workers before it applies fail_under.
        run: pytest -q -n auto --timeout=30 --cov --cov-report=term-missing --cov-report=xml
      - name: Publish the coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            { echo '### Python coverage'; echo; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
      - run: ruff check custom_components tests .github/scripts
      - run: ruff format --check custom_components tests .github/scripts
      - name: Check strict typing
        run: mypy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check and test the dashboard cards, including property-based fuzzing and a coverage gate
        run: |
          node --check custom_components/autodarts/frontend/autodarts-card.js
          npm test
