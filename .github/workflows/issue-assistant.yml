name: Issue assistant

# The first analysis of new issues, the labels of the issue forms and the answers
# that the assistant or the maintainer waits for; see docs/development.md#issue-assistant.
#
# event    no AI: labels and the next task, from trusted code of main
# analyze  an AI engine reads the checkout and a context folder and answers with
#          JSON; read-only token, read-only tools, egress-firewall runner
#          (.github/egress-firewall.yaml)
# apply    no AI: checks the engine's answer and is the only job that writes
#
# The repository variable ISSUE_ASSISTANT_ENGINE chooses the engine (default
# claude); docs/development.md#engines describes how to add one. Without the
# engine's secret, or with ISSUE_ASSISTANT_AI set to "off", only labels and the
# lifecycle work.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue
        required: true
        type: number
      mode:
        description: Task of the assistant
        type: choice
        options: [triage, follow-up, maintainer-reply]
        default: triage
      dry_run:
        description: Only show what the assistant would do
        type: boolean
        default: true

permissions: {}

concurrency:
  group: issue-assistant-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  event:
    name: Handle the event
    if: >-
      github.repository == 'Dennis-Otto/ha-autodarts' &&
      (github.event_name == 'workflow_dispatch' ||
        (!github.event.issue.pull_request &&
         github.event.sender.type != 'Bot' &&
         (github.event.action != 'edited' ||
          github.event.sender.login == github.event.issue.user.login)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      issue: ${{ steps.event.outputs.issue }}
      mode: ${{ steps.event.outputs.mode }}
    steps:
      # Issue events always run the workflow and the script of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set labels and choose the next task
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: python3 .github/scripts/issue_assistant.py event

  analyze:
    name: Analyze with the AI engine
    needs: event
    if: >-
      needs.event.outputs.mode != '' &&
      needs.event.outputs.mode != 'none' &&
      vars.ISSUE_ASSISTANT_AI != 'off'
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 20
    # Keep the engine's secret in this environment, limited to main; no deployment
    # is recorded for a run.
    environment:
      name: issue-assistant
      deployment: false
    permissions:
      contents: read
      issues: read
      discussions: read
    outputs:
      engine: ${{ steps.engine.outputs.engine }}
      # One answer per engine step; only the chosen engine runs.
      answer: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the engine and check its credentials
        id: engine
        env:
          ISSUE_ASSISTANT_ENGINE: ${{ vars.ISSUE_ASSISTANT_ENGINE }}
          # One line per engine: whether its secret exists.
          CREDENTIALS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: python3 .github/scripts/issue_assistant.py engine
      - name: Collect the issue, earlier issues and discussions
        id: context
        if: steps.engine.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.event.outputs.issue }}
          MODE: ${{ needs.event.outputs.mode }}
        # Writes .issue-assistant/prompt.md and schema.json for every engine.
        run: python3 .github/scripts/issue_assistant.py context --issue "$ISSUE" --mode "$MODE"

      # The engines. Each one gets the prompt and the JSON schema, may only read
      # files of the checkout and returns the JSON answer.

      - name: Analyze with Claude
        id: claude
        if: steps.engine.outputs.ready == 'true' && steps.engine.outputs.engine == 'claude'
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        env:
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Issues come from people without write access. The token is the job's
          # read-only GITHUB_TOKEN, and Claude can only read files of the checkout.
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          prompt: ${{ steps.context.outputs.prompt }}
          # --restricted removes every tool that runs code or reaches the network,
          # ignores settings files and confines the file tools to the checkout;
          # --tools leaves only the reading tools, and nothing ever prompts.
          claude_args: |
            --restricted
            --tools "Read,Grep,Glob"
            --permission-prompts none
            --model ${{ vars.ISSUE_ASSISTANT_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
            --json-schema '${{ steps.context.outputs.schema }}'

  apply:
    name: Check and post the analysis
    needs: [event, analyze]
    if: needs.analyze.outputs.answer != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      discussions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the engine's answer and post it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.event.outputs.issue }}
          MODE: ${{ needs.event.outputs.mode }}
          ISSUE_ASSISTANT_ENGINE: ${{ needs.analyze.outputs.engine }}
          RESULT: ${{ needs.analyze.outputs.answer }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: python3 .github/scripts/issue_assistant.py apply --issue "$ISSUE" --mode "$MODE"
