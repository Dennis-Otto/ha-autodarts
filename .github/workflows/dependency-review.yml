name: Dependency review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base commit for the dependency comparison"
        required: true
        type: string
      head_ref:
        description: "Candidate commit for the dependency comparison"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.base_ref || github.event.pull_request.base.sha }}
          head-ref: ${{ inputs.head_ref || github.event.pull_request.head.sha }}
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          show-patched-versions: true
          retry-on-snapshot-warnings: true
          # Home Assistant 2026.9 pins cryptography 48.0.1 and PyJWT 2.13.0, which
          # only the test environment installs; the integration ships no Python
          # dependencies. The same advisories as in osv-scanner.toml, which says
          # when they go.
          allow-ghsas: >-
            GHSA-g6cj-pr64-35w5,
            GHSA-jwv3-5hgf-82ww,
            GHSA-m2h6-j472-rp4c,
            GHSA-2gx3-rcp4-g85q,
            GHSA-42vr-xj54-vc7v,
            GHSA-8wjv-2p76-3863,
            GHSA-9j54-fg26-wv3r,
            GHSA-9v7f-9g4p-ffgj,
            GHSA-ffc3-869f-jxw9,
            GHSA-gvp8-978c-rx2q,
            GHSA-hxm8-2xgr-2p9m,
            GHSA-jwrc-g2q2-pq5p,
            GHSA-p4g4-x82p-q773,
            GHSA-r6x4-923q-g947,
            GHSA-w2cx-738m-mc7w,
            GHSA-w6j9-cwv2-h6wq,
            GHSA-x33g-cr3x-6449
