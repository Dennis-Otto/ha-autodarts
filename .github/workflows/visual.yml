name: Visual check

# Renders every image of the documentation from the demo, with its frozen clock, for
# each pull request that changes the cards or the screenshot tool, and compares them
# with the committed ones pixel by pixel. The images come in three fixed groups
# (GROUPS in tests/e2e/screenshots.py): each group of each language renders on a
# runner of its own from a fresh demo, all side by side, and then the compare job of
# a language puts its groups together and compares them (tests/e2e/collect.sh), as
# tests/e2e/visual.sh does on one machine. It only reports: the summary lists every
# image that looks different with the share of its pixels that changed, the artifact
# holds the images before and after with their differences, and visual-comment.yml
# writes the list into one comment on the pull request. An intended change reaches
# docs/images through the screenshot bot after the merge. An image that can't be
# rendered fails the check, and the other language still gets its report.

on:
  pull_request:
    paths:
      - custom_components/autodarts/frontend/**
      - tests/e2e/**
      - "!tests/e2e/browser.py"
      - "!tests/e2e/shards.py"
      - "!tests/e2e/browser.sh"
      - "!tests/e2e/run.sh"
      - "!tests/e2e/configuration.yaml"
      - "!tests/e2e/README.md"
      - "!tests/e2e/accessibility-baseline.toml"
      - .github/workflows/visual.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: render (${{ matrix.language }}, ${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    # The demo takes about two minutes, the images of a group about six.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # A group that fails leaves the other groups and the other language running.
      fail-fast: false
      matrix:
        language: [en, de]
        group: [1, 2, 3]
    steps:
      # Only the hosts of the steps: the code from github.com, Home Assistant from
      # GitHub's registry (ghcr.io, pkg-containers.githubusercontent.com), Playwright
      # from Microsoft's (mcr.microsoft.com, *.data.mcr.microsoft.com), pngquant from
      # Launchpad (launchpad.net, launchpadlibrarian.net) and the Python packages of
      # the tool (pypi.org, files.pythonhosted.org). Home Assistant itself reaches
      # only the icons of its other integrations, which the images show
      # (brands.home-assistant.io).
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443
            launchpad.net:443
            launchpadlibrarian.net:443
            pypi.org:443
            files.pythonhosted.org:443
            brands.home-assistant.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the images of the group with the frozen clock
        env:
          LANGUAGES: ${{ matrix.language }}
          SCREENSHOT_GROUP: ${{ matrix.group }}/3
          IMAGES: tests/e2e/artifacts/rendered
        run: bash tests/e2e/screenshots.sh
      - name: List how long the sections took
        if: ${{ !cancelled() }}
        run: |
          for table in tests/e2e/artifacts/screenshots-*.md; do
            if [[ -f "$table" ]]; then
              cat "$table" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Keep the images of the group
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-${{ matrix.language }}-${{ matrix.group }}
          path: tests/e2e/artifacts/rendered/
          if-no-files-found: error
          retention-days: 1
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-failure-${{ matrix.language }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: tests/e2e/artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14

  compare:
    name: compare (${{ matrix.language }})
    needs: render
    # Also after a failed group: the other language still gets its report.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [en, de]
    steps:
      # The code and Pillow for the comparison; Harden-Runner itself allows the
      # storage of the artifacts. No step needs sudo or Docker.
      - name: Block every host that the job doesn't need
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
          disable-sudo-and-containers: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Take the images of every group
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rendered-${{ matrix.language }}-*
          path: tests/e2e/artifacts
      - name: Install Pillow for the comparison
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes -r tests/e2e/requirements-browser.txt
      - name: Put the groups together and compare them with the committed images
        env:
          LANGUAGES: ${{ matrix.language }}
          PYTHON: ${{ runner.temp }}/venv/bin/python
        run: bash tests/e2e/collect.sh
      - name: List the images that look different
        run: cat tests/e2e/artifacts/visual/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the images before and after, with their differences
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-${{ matrix.language }}
          path: tests/e2e/artifacts/visual/
          if-no-files-found: error
          retention-days: 14
