name: Property tests

on:
  schedule:
    # Nightly: new random examples for the Hypothesis property and state-machine tests.
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Hypothesis seed from a failed run to replay it; empty picks a new one"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: property-tests
  cancel-in-progress: false

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install hash-pinned test dependencies
        run: pip install --require-hashes -r requirements-test.txt
      - name: Run the property and state-machine tests with a random seed
        env:
          REPLAY_SEED: ${{ inputs.seed }}
        run: |
          seed="${REPLAY_SEED:-$(python3 -c 'import secrets; print(secrets.randbits(32))')}"
          echo "Hypothesis seed: \`$seed\`. Run this workflow with it to replay the run." | tee -a "$GITHUB_STEP_SUMMARY"
          # Pull requests replay the same examples: on a CI variable, Hypothesis and
          # tests/conftest.py load derandomized "ci" profiles, and a derandomized
          # test ignores --hypothesis-seed. Without the variables the "local"
          # profile draws new examples from the seed.
          unset CI GITHUB_ACTIONS
          # The hypothesis marker selects every @given test and state machine.
          pytest -q -n auto --timeout=120 -m hypothesis \
            --hypothesis-profile=local --hypothesis-seed="$seed"
