# Rules of the dependency review of pull requests (.github/workflows/dependency-review.yml).
# An advisory that this repository accepts, for example in a dependency that only
# the tests install and that a pinned upstream can't move yet, goes into
# allow-ghsas with its reason.
fail-on-severity: moderate
fail-on-scopes:
  - runtime
  - development
  - unknown
show-patched-versions: true
retry-on-snapshot-warnings: true
# The same advisories as in osv-scanner.toml, which says when they go; none since
# Home Assistant 2026.10.
allow-ghsas: []

# The licenses a new dependency may have: free licenses that the MIT
# license of this project can carry.
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BSL-1.0
  - CC-BY-3.0
  - CC-BY-4.0
  - CC0-1.0
  - ISC
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - MIT
  - MIT-CMU
  - MIT-0
  - MPL-2.0
  - OFL-1.1
  - PSF-2.0
  - Python-2.0
  - Unicode-3.0
  - Unicode-DFS-2016
  - Unlicense
  - Zlib
# The cloud parts of Home Assistant's test base, which the integration never ships.
allow-dependencies-licenses:
  # The tools of the blueprint bot (.github/copier-requirements.txt), which no release
  # ships: Copier's Jinja filters (GPL-3.0-only) and typing-extensions, whose
  # license the review reads wrongly.
  - pkg:pypi/jinja2-ansible-filters
  - pkg:pypi/typing-extensions
  # The dictionaries of cspell, the spell check of the prose in .github/prose/, which
  # only the checks run: Django's words (WTFPL) and the common misspellings
  # (CC-BY-SA-4.0).
  - pkg:npm/%40cspell/dict-django
  - pkg:npm/%40cspell/dict-en-common-misspellings
  - pkg:pypi/hass-nabucasa
  - pkg:pypi/snitun
  - pkg:pypi/pyric
  - pkg:pypi/text-unidecode
  # regex, which the voice parts of Home Assistant's test base bring in, declares
  # Apache-2.0 AND CNRI-Python.
  - pkg:pypi/regex
  # The URI parser of ESLint, a tool of the checks that no release ships: BSD-2-Clause,
  # which the review reads as BSD-2-Clause AND BSD-2-Clause-Views.
  - pkg:npm/uri-js
  # PyGithub, which pytest-homeassistant-custom-component brings into the tests only:
  # LGPL-3.0-only, which the review reads as GPL-3.0 AND LGPL-3.0 since 2.10.0.
  - pkg:pypi/pygithub
