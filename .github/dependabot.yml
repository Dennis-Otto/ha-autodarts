# Renovate keeps the actions, the dependencies and the images current
# (.github/renovate.json5). Dependabot keeps only the Features of the dev container,
# because it alone also updates their lock file, .devcontainer/devcontainer-lock.json.
# Their updates merge on their own once every check passes (dependabot-automerge.yml).
version: 2
updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      dev-container-features:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  # The browser test and the screenshot tool of the end-to-end tests.
  - package-ecosystem: pip
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      # Playwright must match the browsers of the pinned Playwright image.
      - dependency-name: playwright
    groups:
      browser-tools:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  # The tools of the tests of the cards; nothing of it is shipped.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      npm-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # The Home Assistant and the board mock of the end-to-end tests.
  - package-ecosystem: docker-compose
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      containers-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      containers-major:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: chore
      include: scope
