blueprint:
  name: "HomeDarts: ask Assist about your darts"
  description: >-
    Answers questions about your darts when you ask Assist, in English,
    German, Spanish, French or Dutch: your 3-dart average today or this week,
    for example "What is my average today?", "Wie ist mein Schnitt diese
    Woche?", "¿Cuál es mi media de hoy?", "Quelle est ma moyenne cette
    semaine ?" or "Wat is mijn gemiddelde vandaag?", the 180s of the week, the
    darts of the day towards the daily goal, your best checkout, the training
    streak, who leads the leaderboard and where a player should aim, such as
    "Where should Alex aim?". Assist answers in the language you asked in.


    The answers come from the statistics of the board: today counts every
    training session of the day, the week is the week of the weekly report,
    the best checkout is the personal best of the board, and the leaderboard
    ranks the players by their 3-dart average, as the scoreboard does. The best
    aim follows the spread of a player's darts that the board detected; "I",
    "ich", "yo", "je" or "ik" is the player linked to the person you are signed
    in as, or else the player who played last.


    Assist hears these sentences before its own commands, so each has a word of
    darts, such as average, 180, checkout or leaderboard: "What time is it"
    stays Assist's own.


    Sentences saved in an automation stay as they are: re-import the blueprint
    and leave the sentences at their default to get those of a new version.


    [Settings and examples in the guide](https://dennis-otto.github.io/homedarts-for-autodarts/automations.html#ask-assist-about-your-darts)
  domain: automation
  author: Dennis Otto
  source_url: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/blueprints/automation/homedarts/ask_about_darts.yaml
  homeassistant:
    min_version: "2026.8.0"
  input:
    average_today_sentences:
      name: Average today
      description: >-
        Questions for the 3-dart average of today's training sessions; parts in
        [brackets] are optional, (a|b) means a or b.
      default:
        - "(what is|what's|tell me) (my|our) [three dart] average [today]"
        - "how (am I|are we) (throwing|scoring) today"
        - "(wie|was) ist (mein|unser) (Average|Schnitt|Durchschnitt|3-Dart-Average) [heute]"
        - "(wie|was) ist heute (mein|unser) (Average|Schnitt|Durchschnitt|3-Dart-Average)"
        - "wie (werfe ich|werfen wir) heute"
        - "(cuál|cual) es (mi|nuestra) media [de tres dardos] [de hoy|hoy]"
        - "(qué|que) media (llevo|llevamos) [hoy]"
        - "quelle est (ma|notre) moyenne [aujourd'hui|du jour]"
        - "quelle moyenne (ai-je|j'ai|avons-nous|on a) [aujourd'hui]"
        - "wat is (mijn|ons) (gemiddelde|3-dart-gemiddelde) [vandaag]"
        - "wat is vandaag (mijn|ons) (gemiddelde|3-dart-gemiddelde)"
        - "hoe (gooi ik|gooien we) vandaag"
      selector:
        text:
          multiple: true
    average_week_sentences:
      name: Average this week
      description: Questions for the 3-dart average of the week of the weekly report.
      default:
        - "(what is|what's|tell me) (my|our) [three dart] average (this week|for the week)"
        - "how (am I|are we) (throwing|scoring) this week"
        - "(wie|was) ist (mein|unser) (Average|Schnitt|Durchschnitt|3-Dart-Average) [in] (diese|dieser) Woche"
        - "(wie|was) ist diese Woche (mein|unser) (Average|Schnitt|Durchschnitt|3-Dart-Average)"
        - "wie (werfe ich|werfen wir) diese Woche"
        - "(cuál|cual) es (mi|nuestra) media [de tres dardos] [de] esta semana"
        - "(qué|que) media (llevo|llevamos) esta semana"
        - "quelle est (ma|notre) moyenne [de] cette semaine"
        - "quelle moyenne (ai-je|j'ai|avons-nous|on a) cette semaine"
        - "wat is (mijn|ons) (gemiddelde|3-dart-gemiddelde) [van] deze week"
        - "wat is deze week (mijn|ons) (gemiddelde|3-dart-gemiddelde)"
        - "hoe (gooi ik|gooien we) deze week"
      selector:
        text:
          multiple: true
    scores_180_sentences:
      name: 180s this week
      description: Questions for the 180s of the week of the weekly report.
      default:
        - "how many (180s|180's|180|one hundred eighties|one eighties|maximums) [(have|did) (I|we) (thrown|throw|hit|scored|score)] this week"
        - "wie viele (180er|180|Hundertachtziger|Maximums) [(habe|hab|haben) (ich|wir)] [in] (diese|dieser) Woche [geworfen]"
        - "(cuántos|cuantos) 180 [llevo|llevamos|he hecho|hemos hecho|he lanzado|hemos lanzado] esta semana"
        - "combien de 180 [(ai-je|j'ai|avons-nous|on a) (fait|faits|lancé|lancés|réussi|réussis)] cette semaine"
        - "hoeveel (180's|180|honderdtachtigs) [heb ik|hebben we] deze week [gegooid]"
      selector:
        text:
          multiple: true
    darts_today_sentences:
      name: Darts today
      description: Questions for the darts of the day, towards the daily goal.
      default:
        - "how many darts [(have|did) (I|we) (thrown|throw)] today"
        - "wie viele Darts [(habe|hab|haben) (ich|wir)] heute [geworfen]"
        - "(cuántos|cuantos) dardos [llevo|llevamos|he lanzado|hemos lanzado|he tirado|hemos tirado] hoy"
        - "combien de fléchettes [(ai-je|j'ai|avons-nous|on a) (lancé|lancées)] aujourd'hui"
        - "hoeveel darts [heb ik|hebben we] vandaag [gegooid]"
      selector:
        text:
          multiple: true
    checkout_sentences:
      name: Best checkout
      description: Questions for the highest checkout among the personal bests of the board.
      default:
        - "(what is|what's) (my|our|the) (best|highest) checkout"
        - "(was|wie hoch) ist (mein|unser|der) (bester|höchster) Checkout"
        - "(was|wie hoch) ist (mein|unser) (bestes|höchstes) Finish"
        - "(was|wie hoch) ist das (beste|höchste) Finish"
        - "(cuál|cual) es (mi|nuestro|el) (mejor cierre|cierre más alto|cierre mas alto)"
        - "(cuál|cual) es (mi|nuestro|el) (mejor checkout|checkout más alto|checkout mas alto)"
        - "quel est (mon|notre|le) (meilleur|plus haut|plus gros) (finish|checkout)"
        - "wat is (mijn|onze|de) (hoogste|beste) (uitgooi|finish|checkout)"
      selector:
        text:
          multiple: true
    streak_sentences:
      name: Training streak
      description: Questions for the days in a row with darts, and the longest streak.
      default:
        - "(how long is|what is|what's) (my|our) [training] streak"
        - "how many days in a row [have (I|we) (trained|played|thrown)]"
        - "wie lang ist (meine|unsere) (Serie|Trainingsserie)"
        - "wie viele Tage (in Folge|hintereinander) [(habe|hab|haben) (ich|wir) trainiert]"
        - "(cuál|cual) es (mi|nuestra) racha [de entrenamiento]"
        - "(cuántos|cuantos) días seguidos [llevo|llevamos] [entrenando|jugando]"
        - "quelle est (ma|notre) série [d'entraînement]"
        - "combien de jours (d'affilée|de suite|consécutifs)"
        - "hoe lang is (mijn|onze) (reeks|trainingsreeks)"
        - "hoeveel dagen (op rij|achter elkaar) [(heb ik|hebben we) getraind]"
      selector:
        text:
          multiple: true
    leader_sentences:
      name: Leaderboard
      description: Questions for the player at the top of the leaderboard.
      default:
        - "who (leads|is leading|tops|is on top of|is top of|is first on) the leaderboard"
        - "wer führt die Bestenliste [an]"
        - "wer (ist|steht) (vorne|oben|ganz oben|an der Spitze) (in der|auf der) Bestenliste"
        - "wer (ist|steht) an der Spitze der Bestenliste"
        - "(quién|quien) (lidera|encabeza) la clasificación"
        - "(quién|quien) (es|va) (el primero|primero) (de|en) la clasificación"
        - "qui (mène|domine) le classement"
        - "qui est (en tête|premier|première) du classement"
        - "wie leidt de ranglijst"
        - "wie staat (bovenaan|eerste|op één) [op|in] de ranglijst"
      selector:
        text:
          multiple: true
    aim_sentences:
      name: Best aim
      description: >-
        Questions for the best aim of a player, `{player}`: "I", "ich", "yo",
        "je" or "ik" is you, as are sentences without a player.
      default:
        - "where (should|do|does|must) {player} aim [at]"
        - "(wohin|worauf) soll {player} zielen"
        - "(dónde|donde|a dónde|a donde) (debe|tiene que|debería) apuntar {player}"
        - "(dónde|donde|a dónde|a donde) (debo|tengo que|debería) apuntar"
        - "où (doit|devrait) viser {player}"
        - "où (dois-je|devrais-je) viser"
        - "où est-ce que je dois viser"
        - "waar (moet|zou) {player} [op] (mikken|richten)"
      selector:
        text:
          multiple: true
    board:
      name: Board
      description: The Autodarts board whose statistics answer. Without one, the board with the most darts this week answers.
      default: ""
      selector:
        config_entry:
          integration: homedarts

mode: queued

triggers:
  - trigger: conversation
    id: average_today
    command: !input average_today_sentences
  - trigger: conversation
    id: average_week
    command: !input average_week_sentences
  - trigger: conversation
    id: scores_180
    command: !input scores_180_sentences
  - trigger: conversation
    id: darts_today
    command: !input darts_today_sentences
  - trigger: conversation
    id: checkout
    command: !input checkout_sentences
  - trigger: conversation
    id: streak
    command: !input streak_sentences
  - trigger: conversation
    id: leader
    command: !input leader_sentences
  - trigger: conversation
    id: aim
    command: !input aim_sentences

