  # The language of the question, such as de for de-CH; English for any other.
  language: >-
    {% set spoken = (trigger.user_input.language if trigger.user_input is defined else '')
       | default('', true) | lower | regex_replace('[-_].*$', '') %}
    {{ spoken if spoken in answers else 'en' }}
  # The statistics of the board, found by the attributes each sensor always has,
  # so they are found under any name and in any language. Without a board chosen,
  # the board with the most darts this week answers, all of it from that board.
  sensors: >-
    {% set ns = namespace(boards={}) %}
    {%- for state in expand(integration_entities('homedarts'))
        if state.domain == 'sensor'
        and (not board or config_entry_id(state.entity_id) == board) %}
    {%- set a = state.attributes %}
    {%- set kind = 'week' if 'training_minutes' in a
        else 'profiles' if a.unit_of_measurement == 'players' and 'players' in a
        else 'records' if 'record' in a and 'previous' in a
        else 'streak' if 'best_streak' in a and 'trained_today' in a
        else 'today' if 'goal_reached' in a
        else 'sessions' if a.sessions is list
        else 'darts' if 'hits' in a and 'last_reset' in a
        else 'points' if a.unit_of_measurement == 'points' and 'last_reset' in a
        else '' %}
    {%- set entry = config_entry_id(state.entity_id) %}
    {%- set found = ns.boards.get(entry, {}) %}
    {%- if kind and kind not in found %}
    {%- set ns.boards = ns.boards | combine({entry: found | combine({kind: state.entity_id})}) %}
    {%- endif %}
    {%- endfor %}
    {%- set pick = namespace(found={}, darts=-1) %}
    {%- for found in ns.boards.values() %}
    {%- set darts = states(found.week) | int(0) if 'week' in found else 0 %}
    {%- if darts > pick.darts %}
    {%- set pick.found = found %}
    {%- set pick.darts = darts %}
    {%- endif %}
    {%- endfor %}
    {{ pick.found }}
  # The player a question about the best aim is for: one named, or you.
  asked: "{{ trigger.slots.player | default('', true) | trim }}"
  person: >-
    {% set user = trigger.user_input.context.user_id
       if trigger.user_input is defined else none %}
    {{ (states.person | selectattr('attributes.user_id', 'eq', user)
        | map(attribute='entity_id') | first | default('')) if user else '' }}

actions:
  - variables:
      reply: >-
        {% set say = answers[language] %}
        {% set id = trigger.id %}
        {# A number as it is said: one decimal, none for a whole number. #}
        {% macro decimal(value) %}{% set rounded = value | float | round(1) %}{{
          (rounded | int if rounded == rounded | int else rounded) | string
          | replace('.', answers[language].decimal) }}{% endmacro %}
        {% if id == 'average_today' %}
          {# The sessions that started today: those that ended, and the one the
             sensors of the session show, also after it ended. #}
          {% set ns = namespace(darts=0, points=0) %}
          {% set current = as_datetime(state_attr(sensors.darts, 'last_reset'), none)
             if sensors.darts is defined else none %}
          {% for session in (state_attr(sensors.sessions, 'sessions')
                             if sensors.sessions is defined else none) or [] %}
            {% set started = as_datetime(session.started, none) %}
            {% if started and started >= today_at() and started != current %}
              {% set ns.darts = ns.darts + session.darts | int(0) %}
              {% set ns.points = ns.points + session.points | int(0) %}
            {% endif %}
          {% endfor %}
          {% set darts = states(sensors.darts) | int(0) if sensors.darts is defined else 0 %}
          {% set points = states(sensors.points) | int(0) if sensors.points is defined else 0 %}
          {% if current and current >= today_at() %}
            {% set ns.darts = ns.darts + darts %}
            {% set ns.points = ns.points + points %}
          {% endif %}
          {# A session that began before midnight and runs on has no day of its own. #}
          {% set today = states(sensors.today) | int(0) if sensors.today is defined else 0 %}
          {% if ns.darts %}
            {{ say.average_today | replace('{average}', decimal(ns.points / ns.darts * 3))
               | replace('{darts}', ns.darts | string) }}
          {% elif today and darts %}
            {{ say.average_session | replace('{average}', decimal(points / darts * 3))
               | replace('{darts}', darts | string) }}
          {% else %}
            {{ say.no_darts_today }}
          {% endif %}
        {% elif id in ['average_week', 'scores_180'] %}
          {% set week = sensors.week if sensors.week is defined else none %}
          {% set average = state_attr(week, 'average') if week else none %}
          {% set count = state_attr(week, 'scores_180') | int(0) if week else 0 %}
          {% if id == 'scores_180' %}
            {{ say.scores_180 | replace('{count}', count | string)
               if count else say.no_180 }}
          {% elif average is number %}
            {% set change = state_attr(week, 'average_change') %}
            {% set change = change | round(1) if change is number else 0 %}
            {{ (say.average_week_up if change > 0
                else say.average_week_down if change < 0 else say.average_week)
               | replace('{average}', decimal(average))
               | replace('{change}', decimal(change | abs)) }}
          {% else %}
            {{ say.no_darts_week }}
          {% endif %}
        {% elif id == 'darts_today' %}
          {% set today = sensors.today if sensors.today is defined else none %}
          {% set darts = states(today) | int(0) if today else 0 %}
          {% set goal = state_attr(today, 'goal') | int(0) if today else 0 %}
          {% if not darts %}
            {{ say.no_darts_today }}
          {% else %}
            {{ (say.darts_today_one if darts == 1
                else say.darts_today | replace('{darts}', darts | string))
               ~ (' ' ~ say.goal_reached if goal and state_attr(today, 'goal_reached')
                  else ' ' ~ say.goal_left | replace('{left}', (goal - darts) | string)
                       | replace('{goal}', goal | string) if goal else '') }}
          {% endif %}
        {% elif id == 'checkout' %}
          {% set best = state_attr(sensors.records, 'highest_checkout')
             if sensors.records is defined else none %}
          {{ say.checkout | replace('{checkout}', best | int | string)
             if best else say.no_checkout }}
        {% elif id == 'streak' %}
          {% set streak = sensors.streak if sensors.streak is defined else none %}
          {% set days = states(streak) | int(0) if streak else 0 %}
          {% set best = state_attr(streak, 'best_streak') | int(0) if streak else 0 %}
          {{ (say.never_streak if not best else say.no_streak if not days
              else say.streak_one if days == 1
              else say.streak | replace('{days}', days | string))
             | replace('{best}', best | string) }}
        {% else %}
          {% set players = (state_attr(sensors.profiles, 'players')
                            if sensors.profiles is defined else none) or [] %}
          {% if id == 'leader' %}
            {# The ranking of the scoreboard: the 3-dart average, then the legs
               won, then the name. #}
            {% set ns = namespace(best=none, average=-1, won=0) %}
            {% for player in players if player.legs_played | int(0) > 0 %}
              {% set average = player.average if player.average is number else -1 %}
              {% set won = player.legs_won | int(0) %}
              {% if ns.best is none or average > ns.average
                 or (average == ns.average and (won > ns.won
                     or (won == ns.won and player.name | lower < ns.best.name | lower))) %}
                {% set ns.best = player %}
                {% set ns.average = average %}
                {% set ns.won = won %}
              {% endif %}
            {% endfor %}
            {% if ns.best is none %}
              {{ say.no_leader }}
            {% elif ns.best.average is number %}
              {{ say.leader | replace('{name}', ns.best.name)
                 | replace('{average}', decimal(ns.best.average)) }}
            {% else %}
              {{ say.leader_plain | replace('{name}', ns.best.name) }}
            {% endif %}
          {% else %}
            {% set name = asked | string %}
            {% set me = not name
               or name | lower in ['i', 'me', 'ich', 'mich', 'yo', 'je', 'moi', 'ik'] %}
            {% set ns = namespace(profile=none) %}
            {% for player in players if ns.profile is none %}
              {% if (me and person and player.person == person)
                 or (not me and player.name | lower == name | lower) %}
                {% set ns.profile = player %}
              {% endif %}
            {% endfor %}
            {% set profile = ns.profile or (players | first if me else none) %}
            {% if not profile %}
              {{ say.no_players if me else say.unknown_player | replace('{name}', name) }}
            {% elif profile.best_aim %}
              {% set bed = profile.best_aim | string %}
              {% set spoken = say.beds.bull if bed == 'BULL' else bed if bed == '25'
                 else say.beds[{'S': 'single', 'D': 'double', 'T': 'triple'}[bed[:1]]]
                      | replace('{number}', bed[1:]) %}
              {{ say.aim | replace('{name}', profile.name) | replace('{bed}', spoken)
                 | replace('{points}', decimal(profile.expected_ppd)) }}
            {% else %}
              {{ say.no_aim | replace('{name}', profile.name) }}
            {% endif %}
          {% endif %}
        {% endif %}
  - set_conversation_response: "{{ reply | trim }}"
