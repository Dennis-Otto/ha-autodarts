blueprint:
  name: "HomeDarts: dart caller"
  description: >-
    Announces every visit on your speakers, like a caller on stage, and
    optionally every single dart. A visit of three darts is called when its
    third dart lands; a shorter visit when the darts are pulled.


    The messages are templates. Visit messages can use `score`, `darts`,
    `segments` and `call` ("One hundred and eighty!" after a 180); dart
    messages can use `dart_name` (for example `Treble 20`, `Bull` or `Miss`),
    `segment` (for example `T20`), `dart_score` and `dart_index`. `call` and
    `dart_name` are in the language of Home Assistant; an older version of the
    integration makes them English. An empty message stays silent. With a
    voice pack, such as one of darts-caller, its recorded sounds call the
    scores and the darts it has.


    While a practice game of the integration is played, the practice caller
    has the floor and this caller stays silent, unless you turn that off. The
    caller of the scoreboard card announces visits and the game in one voice.


    [Settings and examples in the guide](https://dennis-otto.github.io/homedarts-for-autodarts/automations.html#dart-caller)
  domain: automation
  author: Dennis Otto
  source_url: https://github.com/Dennis-Otto/homedarts-for-autodarts/blob/main/blueprints/automation/homedarts/dart_caller.yaml
  homeassistant:
    min_version: "2026.8.0"
  input:
    board:
      name: Board
      icon: mdi:bullseye-arrow
      input:
        board_events:
          name: Board events
          description: The "Events" entity of your Autodarts board.
          selector:
            entity:
              filter:
                - integration: homedarts
                  domain: event
    voice:
      name: Voice
      icon: mdi:account-voice
      input:
        tts_engine:
          name: Text-to-speech engine
          description: The engine that speaks, for example Home Assistant Cloud or Piper.
          selector:
            entity:
              filter:
                - domain: tts
        speakers:
          name: Speakers
          description: The media players that play the calls.
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        language:
          name: Language
          description: >-
            Optional. The language of the voice, for example `en-GB` or
            `de-DE`. Empty uses the language of the engine.
          default: ""
          selector:
            text: {}
        tts_options:
          name: Voice options
          description: >-
            Optional. Options of the engine, for example `voice: ...` for
            another voice. See the documentation of your engine.
          default: {}
          selector:
            object: {}
        voice_pack:
          name: Voice pack
          description: >-
            Optional. A voice pack in `homedarts/voices` of the media folder,
            for example a pack of darts-caller or one recorded with the action
            `homedarts.generate_voice_pack`. Its sounds call the scores of
            visits and the darts; the engine speaks what the pack lacks.
            Needs version 1.15.0 or later of the integration.
          default: ""
          selector:
            text: {}
    calls:
      name: Calls
      icon: mdi:bullhorn
      input:
        call_each_dart:
          name: Call every dart
          description: >-
            Also announce each dart when it lands. The third dart is not
            called on its own: the visit follows right away.
          default: false
          selector:
            boolean: {}
        silent_in_practice_games:
          name: Stay silent in practice games
          description: >-
            While an X01, Cricket or party game of the integration is played,
            leave the calls to the practice caller, so the two never talk over
            each other. Turn this off if you don't use the practice caller.
          default: true
          selector:
            boolean: {}
    messages:
      name: Messages
      icon: mdi:message-text
      collapsed: true
      input:
        visit_message:
          name: Visit message
          description: Said after a visit, for example `{{ score }}` or `{{ score }} points`.
          default: "{{ score }}"
          selector:
            text: {}
        maximum_message:
          name: Message for 180
          description: >-
            Said instead of the visit message after a 180. `{{ call }}` says
            "One hundred and eighty!" in the language of Home Assistant.
          default: "{{ call }}"
          selector:
            text: {}
        dart_message:
          name: Dart message
          description: >-
            Said for each dart when "Call every dart" is on, for example
            `{{ dart_name }}`, the bed in the language of Home Assistant, or
            `{{ dart_score }}`.
          default: "{{ dart_name }}"
          selector:
            text: {}

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: event.received
    id: visit
    target:
      entity_id: !input board_events
    options:
      event_type:
        - visit_thrown
        - visit_completed
  - trigger: event.received
    id: dart
    enabled: !input call_each_dart
    target:
      entity_id: !input board_events
    options:
      event_type:
        - dart_detected

variables:
  # Read from the triggering state: the next event may already have replaced it.
  kind: "{{ trigger.to_state.attributes.get('event_type', '') }}"
  score: "{{ trigger.to_state.attributes.get('score') | int(0) }}"
  darts: "{{ trigger.to_state.attributes.get('darts') | int(0) }}"
  segments: "{{ trigger.to_state.attributes.get('segments') | default([], true) }}"
  segment: "{{ trigger.to_state.attributes.get('segment') | default('', true) }}"
  dart_score: "{{ trigger.to_state.attributes.get('score') | int(0) }}"
  dart_index: "{{ trigger.to_state.attributes.get('dart_index') | int(0) }}"
  game: "{{ trigger.to_state.attributes.get('game') }}"
  # What the caller says, in the language of Home Assistant: the words the
  # integration gives the event. A caller says a bed as T20 "Treble 20", S5
  # "5" and M "Miss", and a visit of 180 "One hundred and eighty!". An older
  # version of the integration gives none; then it is English.
  call: >-
    {% set said = trigger.to_state.attributes.get('call') %}
    {%- set bed = segment | string %}
    {%- if said is string %}{{ said }}
    {%- elif trigger.id != 'dart' %}{{ 'One hundred and eighty!' if score == 180 else (score if score else 'No score') }}
    {%- elif dart_score == 0 %}Miss
    {%- elif bed | upper == 'BULL' %}Bull
    {%- elif bed[:1] == 'T' %}Treble {{ bed[1:] }}
    {%- elif bed[:1] == 'D' %}Double {{ bed[1:] }}
    {%- elif bed[:1] == 'S' %}{{ bed[1:] }}
    {%- else %}{{ bed }}{% endif %}
  dart_name: "{{ call if trigger.id == 'dart' else '' }}"
  silent_in_practice_games: !input silent_in_practice_games
  visit_text: !input visit_message
  maximum_text: !input maximum_message
  dart_text: !input dart_message
  message: >-
    {% if trigger.id == 'dart' %}{{ dart_text }}{% elif score == 180 %}{{ maximum_text }}{% else %}{{ visit_text }}{% endif %}
  speakers: !input speakers
  language: !input language
  tts_options: !input tts_options
  voice_pack: !input voice_pack
  # The sounds of a voice pack for the call, named as in darts-caller's packs:
  # the score of a visit, or the dart: t20, d16, s5 or 5, bull for 25,
  # bullseye, and outside for a miss.
  sounds: >-
    {% set bed = segment | string | upper %}
    {%- if trigger.id != 'dart' %}{{ [score | string] }}
    {%- elif dart_score == 0 %}{{ ['outside'] }}
    {%- elif bed == 'BULL' %}{{ ['bullseye'] }}
    {%- elif bed == '25' %}{{ ['bull'] }}
    {%- elif bed[:1] in ['S', 'D', 'T'] %}{{ [bed | lower] + ([bed[1:]] if bed[:1] == 'S' else []) }}
    {%- else %}{{ [] }}{% endif %}
  speech: >-
    {% set data = {'media_player_entity_id': speakers, 'cache': true, 'message': message | string} %}
    {%- if language %}{% set data = dict(data, language=language) %}{% endif %}
    {%- if tts_options %}{% set data = dict(data, options=tts_options) %}{% endif %}
    {{- data }}

conditions:
  - alias: The practice caller has the floor during a practice game
    condition: template
    value_template: "{{ not (silent_in_practice_games and game) }}"
  - alias: A visit called with its third dart is not called again
    condition: template
    value_template: >-
      {{ kind != 'visit_completed' or not trigger.to_state.attributes.get('thrown', false) }}
  - alias: The third dart is called with its visit
    condition: template
    value_template: "{{ trigger.id != 'dart' or dart_index < 3 }}"
  - alias: An empty message stays silent
    condition: template
    value_template: "{{ message | string | trim | length > 0 }}"

actions:
  - variables:
      sound: {}
  - alias: Find the recorded sound of the call in the voice pack
    # A name no folder of a pack can have leaves the call to the engine, as
    # the action would refuse it before continue_on_error could catch that.
    if: >-
      {{ (voice_pack | string | trim | length) in range(1, 65) and sounds | count > 0 }}
    then:
      # A pack without the sound of the call, or no such pack, leaves the
      # call to the engine.
      - action: homedarts.voice_sound
        continue_on_error: true
        data:
          pack: "{{ voice_pack | string | trim }}"
          keys: "{{ sounds }}"
        response_variable: sound
  - if: "{{ sound.get('media_content_id', '') != '' }}"
    then:
      - action: media_player.play_media
        target:
          entity_id: !input speakers
        data:
          media_content_id: "{{ sound.media_content_id }}"
          media_content_type: music
    else:
      - action: tts.speak
        target:
          entity_id: !input tts_engine
        data: "{{ speech }}"
