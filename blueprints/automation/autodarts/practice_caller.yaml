blueprint:
  name: "Autodarts: practice caller"
  description: >-
    Calls the practice game on your speakers like a caller on stage: what a
    player requires when a checkout is possible, "No score" after a bust, the
    game shot of a leg or the match, the winner when the round limit of X01
    decides them, and optionally the score to leave when no checkout is
    possible and the bull-off.


    The messages are templates. They can use `who` (the player's name, "Bot"
    for the practice game's bot, "Player 2" in a match without names, empty
    when you play alone),
    `remaining`, `checkout` (the route when a checkout is possible, for example
    `T20 T20 BULL`; the score checked out when a leg is won), `darts`,
    `average`, `points` (Cricket and party games), `target` (the next target of
    a party game, for example `20` or `D16`), `leave` and `setup` (the score a
    setup leaves when no checkout is possible, for example `32`, and its darts,
    for example `T20 T20 S17`), `rounds` (the rounds of a leg the round limit
    decided, with the `remaining` score of its winner), and when the bull-off is won
    `hit` (the bed of the winning dart: `BULL`, `25` or for example `S20`) and
    `distance` (millimeters from the center, empty when the board measured no
    position). An empty message stays silent. With a voice pack, such as
    one of darts-caller, its recorded sounds call busts, game shots, the
    match and, when you play alone, what you require.


    The first visit of a game is not called: a practice game starts without a
    turn change, unless a bull-off decides who starts.


    [Settings and examples in the guide](https://dennis-otto.github.io/ha-autodarts/automations.html#practice-caller)
  domain: automation
  author: Dennis Otto
  source_url: https://github.com/Dennis-Otto/ha-autodarts/blob/main/blueprints/automation/autodarts/practice_caller.yaml
  homeassistant:
    min_version: "2026.8.0"
  input:
    board:
      name: Board
      icon: mdi:bullseye-arrow
      input:
        board_events:
          name: Board events
          description: The "Events" entity of your Autodarts board.
          selector:
            entity:
              filter:
                - integration: autodarts
                  domain: event
    voice:
      name: Voice
      icon: mdi:account-voice
      input:
        tts_engine:
          name: Text-to-speech engine
          description: The engine that speaks, for example Home Assistant Cloud or Piper.
          selector:
            entity:
              filter:
                - domain: tts
        speakers:
          name: Speakers
          description: The media players that play the calls.
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        language:
          name: Language
          description: >-
            Optional. The language of the voice, for example `en-GB` or
            `de-DE`. Empty uses the language of the engine.
          default: ""
          selector:
            text: {}
        tts_options:
          name: Voice options
          description: >-
            Optional. Options of the engine, for example `voice: ...` for
            another voice. See the documentation of your engine.
          default: {}
          selector:
            object: {}
        voice_pack:
          name: Voice pack
          description: >-
            Optional. A voice pack in `autodarts/voices` of the media folder,
            for example a pack of darts-caller or one recorded with the action
            `autodarts.generate_voice_pack`. Its sounds call busts, game
            shots, the match and, when you play alone, what you require; the
            engine speaks every other call. Needs version 1.15.0 or later of
            the integration.
          default: ""
          selector:
            text: {}
    messages:
      name: Messages
      icon: mdi:message-text
      collapsed: true
      input:
        checkout_message:
          name: Checkout possible
          description: >-
            Said when the next visit can finish the leg, with `remaining` and
            the route in `checkout`.
          default: "{{ who ~ ', you' if who else 'You' }} require {{ remaining }}"
          selector:
            text: {}
        setup_message:
          name: No checkout, a setup
          description: >-
            Said when the next visit cannot finish the leg but can leave a
            finish for the visit after, with `leave` and the darts in `setup`,
            for example `{{ who ~ ', leave' if who else 'Leave' }} yourself
            {{ leave }}`. Empty uses the "Next player" message.
          default: ""
          selector:
            text: {}
        turn_message:
          name: Next player
          description: >-
            Said when the next visit cannot finish the leg, for example
            `{{ who }}` in a match or `{{ who }}, {{ target }}` in a party
            game. Empty stays silent.
          default: ""
          selector:
            text: {}
        bust_message:
          name: Bust
          description: Said when a dart busts the visit.
          default: "No score"
          selector:
            text: {}
        leg_message:
          name: Leg won
          description: >-
            Said when a dart wins a leg that does not decide the match, with
            `checkout`, `darts` and `average` of the leg. In a team match,
            `team` names the team.
          default: "Game shot, and the leg{{ ', ' ~ (team or who) if team or who }}!"
          selector:
            text: {}
        match_message:
          name: Match won
          description: >-
            Said when a dart decides the match. In a team match, `team` names
            the team.
          default: "Game shot, and the match, {{ team or who }}!"
          selector:
            text: {}
        round_limit_leg_message:
          name: Leg won on the round limit
          description: >-
            Said when the last round of an X01 leg with a round limit ends
            without a checkout and the lowest score wins a leg that does not
            decide the match, with `rounds`, and `remaining` of the winner. In
            a team match, `team` names the team.
          default: "Round limit, and the leg{{ ', ' ~ (team or who) if team or who }}!"
          selector:
            text: {}
        round_limit_match_message:
          name: Match won on the round limit
          description: >-
            Said when the round limit decides the match. In a team match,
            `team` names the team.
          default: "Round limit, and the match{{ ', ' ~ (team or who) if team or who }}!"
          selector:
            text: {}
        bull_off_turn_message:
          name: Bull-off throw
          description: >-
            Said when the next player throws for the bull, for example
            `{{ who }}, throw for the bull`. The first player of the bull-off
            is not called. Empty uses the "Next player" message.
          default: ""
          selector:
            text: {}
        bull_off_message:
          name: Bull-off won
          description: >-
            Said when the bull-off decides who starts, together with the
            first call of the match, for example
            `{{ who }} to throw first. Game on!`. `hit` names the bed of the
            winning dart and `distance` its millimeters, if measured. Empty
            stays silent.
          default: ""
          selector:
            text: {}
        player_label:
          name: Word for a player without a name
          description: For example `Player` makes "Player 2".
          default: "Player"
          selector:
            text: {}
        bot_label:
          name: Word for the bot
          description: >-
            The `who` of the practice game's bot, for example "Bot, you
            require 40", as the scoreboard names it.
          default: "Bot"
          selector:
            text: {}

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: event.received
    target:
      entity_id: !input board_events
    options:
      event_type:
        - turn_changed
        - bust
        - leg_won
        - match_won
        - bull_off_won

variables:
  # Read from the triggering state: the next event may already have replaced it.
  kind: "{{ trigger.to_state.attributes.get('event_type', '') }}"
  # The event before; a won bull-off is called together with the first turn.
  previous: "{{ trigger.from_state.attributes.get('event_type', '') }}"
  player: "{{ trigger.to_state.attributes.get('player') | int(1) }}"
  players: "{{ trigger.to_state.attributes.get('players') | int(1) }}"
  bot: "{{ trigger.to_state.attributes.get('bot', false) }}"
  # Template characters leave the names: some fields, such as the message of a
  # notification, are rendered once more.
  name: >-
    {{ (trigger.to_state.attributes.get('name') or '')
       | regex_replace('[{}%#\x00-\x1f]+', '') | trim }}
  label: !input player_label
  bot_label: !input bot_label
  who: >-
    {{ bot_label if bot else name if name else (label ~ ' ' ~ player if players > 1 else '') }}
  # The team of the player in a team match, when both partners have a name.
  team: >-
    {{ (trigger.to_state.attributes.get('team_name') or '')
       | regex_replace('[{}%#\x00-\x1f]+', '') | trim }}
  remaining: "{{ trigger.to_state.attributes.get('remaining') | int(0) }}"
  checkout: "{{ trigger.to_state.attributes.get('checkout') or '' }}"
  # Where to aim without a checkout: the darts and the score they leave.
  plan: "{{ trigger.to_state.attributes.get('setup') or {} }}"
  leave: "{{ plan.leave if plan else '' }}"
  setup: "{{ plan.route if plan else '' }}"
  darts: "{{ trigger.to_state.attributes.get('darts') | int(0) }}"
  average: "{{ trigger.to_state.attributes.get('average') }}"
  points: "{{ trigger.to_state.attributes.get('points') | int(0) }}"
  target: "{{ trigger.to_state.attributes.get('target') or '' }}"
  bull_off: "{{ trigger.to_state.attributes.get('bull_off', false) }}"
  # A won bull-off is called with the next turn, so its dart is the event before.
  hit: >-
    {{ (trigger.from_state.attributes.get('hit') if previous == 'bull_off_won'
        else trigger.to_state.attributes.get('hit')) or '' }}
  # A dart without a position has no distance: empty, never "None".
  distance: >-
    {% set measured = trigger.from_state.attributes.get('distance')
       if previous == 'bull_off_won' else trigger.to_state.attributes.get('distance') %}
    {{- '' if measured is none else measured }}
  deciding: "{{ trigger.to_state.attributes.get('match', false) }}"
  # A leg the round limit decided, after this many rounds; 0 for a checkout.
  rounds: "{{ trigger.to_state.attributes.get('rounds') | int(0) }}"
  checkout_text: !input checkout_message
  setup_text: !input setup_message
  turn_text: !input turn_message
  bust_text: !input bust_message
  leg_text: !input leg_message
  match_text: !input match_message
  limit_leg_text: !input round_limit_leg_message
  limit_match_text: !input round_limit_match_message
  bull_off_turn_text: !input bull_off_turn_message
  bull_off_text: !input bull_off_message
  message: >-
    {% if kind == 'turn_changed' and bull_off %}{{ bull_off_turn_text or turn_text }}
    {%- elif kind == 'turn_changed' %}
    {%- set call = checkout_text if checkout else (setup_text if setup and setup_text else turn_text) %}
    {%- if previous == 'bull_off_won' %}{{ (bull_off_text | string ~ ' ' ~ call | string) | trim }}
    {%- else %}{{ call }}{% endif %}
    {%- elif kind == 'bust' %}{{ bust_text }}
    {%- elif kind == 'leg_won' %}{{ '' if deciding else (limit_leg_text if rounds else leg_text) }}
    {%- elif kind == 'match_won' %}{{ limit_match_text if rounds else match_text }}
    {%- endif %}
  speakers: !input speakers
  language: !input language
  tts_options: !input tts_options
  voice_pack: !input voice_pack
  # The sounds of a voice pack for the call, named as in darts-caller's packs:
  # what you require when you play alone, a bust, a leg and the match won with
  # a checkout. A call that names the player at the board stays the engine's.
  sounds: >-
    {%- if kind == 'turn_changed' and checkout and players == 1 and not bull_off and previous != 'bull_off_won' %}{{ ['yr_' ~ remaining] }}
    {%- elif kind == 'bust' %}{{ ['busted'] }}
    {%- elif kind == 'leg_won' and not rounds %}{{ ['gameshot'] }}
    {%- elif kind == 'match_won' and not rounds %}{{ ['matchshot'] }}
    {%- else %}{{ [] }}{% endif %}
  speech: >-
    {% set data = {'media_player_entity_id': speakers, 'cache': true, 'message': message | string} %}
    {%- if language %}{% set data = dict(data, language=language) %}{% endif %}
    {%- if tts_options %}{% set data = dict(data, options=tts_options) %}{% endif %}
    {{- data }}

conditions:
  - alias: An empty message stays silent
    condition: template
    value_template: "{{ message | string | trim | length > 0 }}"

actions:
  - variables:
      sound: {}
  - alias: Find the recorded sound of the call in the voice pack
    # A name no folder of a pack can have leaves the call to the engine, as
    # the action would refuse it before continue_on_error could catch that.
    if: >-
      {{ (voice_pack | string | trim | length) in range(1, 65) and sounds | count > 0 }}
    then:
      # A pack without the sound of the call, or no such pack, leaves the
      # call to the engine.
      - action: autodarts.voice_sound
        continue_on_error: true
        data:
          pack: "{{ voice_pack | string | trim }}"
          keys: "{{ sounds }}"
        response_variable: sound
  - if: "{{ sound.get('media_content_id', '') != '' }}"
    then:
      - action: media_player.play_media
        target:
          entity_id: !input speakers
        data:
          media_content_id: "{{ sound.media_content_id }}"
          media_content_type: music
    else:
      - action: tts.speak
        target:
          entity_id: !input tts_engine
        data: "{{ speech }}"
