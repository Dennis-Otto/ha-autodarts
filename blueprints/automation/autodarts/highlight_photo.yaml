blueprint:
  name: "Autodarts: highlight photo"
  description: >-
    Takes a photo of the board after a big visit or a checkout of the practice
    game, from one of the board cameras while the darts are still in the board.
    A visit counts when its third dart lands. When the same dart also wins a
    leg, you get one photo with the checkout message. The bot's darts are not in
    the board, so its visits and legs get no photo.


    The photo is saved to the highlight gallery, which the media browser shows
    under Autodarts, and your actions can send it on: they can use `image` (the
    camera picture, for example `data: {image: "{{ image }}"}` in a
    notification of the Home Assistant app), `message`, `score`, `checkout`,
    `who` and `photo` (the saved file). Turn on the camera entity first;
    camera entities are disabled by default.
  domain: automation
  author: Dennis Otto
  source_url: https://github.com/Dennis-Otto/ha-autodarts/blob/main/blueprints/automation/autodarts/highlight_photo.yaml
  homeassistant:
    min_version: "2026.8.0"
  input:
    board:
      name: Board
      icon: mdi:bullseye-arrow
      input:
        board_events:
          name: Board events
          description: The "Events" entity of your Autodarts board.
          selector:
            entity:
              filter:
                - integration: autodarts
                  domain: event
        camera:
          name: Camera
          description: The board camera that takes the photo.
          selector:
            entity:
              filter:
                - integration: autodarts
                  domain: camera
    moments:
      name: Moments
      icon: mdi:star-shooting
      input:
        minimum_score:
          name: Visits from
          description: A visit with at least this score gets a photo.
          default: 180
          selector:
            number:
              min: 1
              max: 180
              step: 1
              mode: box
              unit_of_measurement: points
        checkouts:
          name: Checkouts
          description: Also a photo when a practice leg is won with a checkout.
          default: true
          selector:
            boolean: {}
    gallery:
      name: Gallery
      icon: mdi:image-multiple
      input:
        save_photo:
          name: Save to the gallery
          description: >-
            Saves every photo as a file in the folder below, named by the time,
            the player and the score, for example
            2026-09-26_21-05-33_Alex_180.jpg.
          default: true
          selector:
            boolean: {}
        gallery_folder:
          name: Folder
          description: >-
            The highlight gallery of the media browser shows the folder
            autodarts/highlights of your media folder: /media on Home Assistant
            OS and in a container. Other installations use the media folder in
            the configuration folder, for example
            /config/media/autodarts/highlights.
          default: /media/autodarts/highlights
          selector:
            text: {}
    photo:
      name: Photo
      icon: mdi:cellphone-message
      input:
        photo_actions:
          name: Actions
          description: >-
            For example a notification with `image: "{{ image }}"` and
            `message: "{{ message }}"`. Optional when the photo goes to the
            gallery.
          default: []
          selector:
            action: {}
        score_message:
          name: Message for a visit
          description: The `message` of a visit photo, with `score`.
          default: "{{ score }}!"
          selector:
            text: {}
        checkout_message:
          name: Message for a checkout
          description: The `message` of a checkout photo, with `checkout` and `who`.
          default: "Checkout {{ checkout }}{{ ' by ' ~ who if who }}!"
          selector:
            text: {}

# A leg won by the third dart follows its visit within milliseconds: the short
# pause lets the checkout replace the visit, so the leg gets one photo.
mode: restart
max_exceeded: silent

triggers:
  - trigger: event.received
    id: visit
    target:
      entity_id: !input board_events
    options:
      event_type:
        - visit_thrown
  - trigger: event.received
    id: checkout
    enabled: !input checkouts
    target:
      entity_id: !input board_events
    options:
      event_type:
        - leg_won

variables:
  minimum_score: !input minimum_score
  camera_entity: !input camera
  image: "/api/camera_proxy/{{ camera_entity }}"
  score: "{{ trigger.to_state.attributes.get('score') | int(0) if trigger.id == 'visit' else 0 }}"
  checkout: >-
    {{ trigger.to_state.attributes.get('checkout') | int(0) if trigger.id == 'checkout' else 0 }}
  # The player at the board: the winner of a leg, or who threw the visit.
  who: "{{ trigger.to_state.attributes.get('name') or '' }}"
  save_photo: !input save_photo
  gallery_folder: !input gallery_folder
  # Characters that file names do not allow, and the separator _, leave the name.
  photo_who: >-
    {{ who | regex_replace('[\\\\/:*?"<>|_\x00-\x1f]+', ' ') | trim }}
  # 2026-09-26_21-05-33_Alex_180.jpg or 2026-09-26_21-07-10_Alex_checkout-121.jpg
  photo: >-
    {{ gallery_folder | trim | regex_replace('/+$', '') }}/{{ now().strftime('%Y-%m-%d_%H-%M-%S') }}
    {{- '_' ~ photo_who if photo_who else '' }}
    {{- '_checkout-' ~ checkout if trigger.id == 'checkout' else '_' ~ score }}.jpg
  score_text: !input score_message
  checkout_text: !input checkout_message
  message: "{{ checkout_text if trigger.id == 'checkout' else score_text }}"

conditions:
  - alias: The visit reaches the score, or the leg has a checkout to show
    condition: template
    value_template: >-
      {{ score >= minimum_score if trigger.id == 'visit' else checkout > 0 }}
  # The darts of the practice game's bot are not in the board to take a picture of.
  - alias: Not a visit or a leg of the bot
    condition: template
    value_template: "{{ 'bot' not in trigger.to_state.attributes }}"

actions:
  - delay:
      milliseconds: 500
  - alias: Save the photo to the gallery
    if: "{{ save_photo }}"
    then:
      # A folder Home Assistant may not write to must not stop the actions.
      - action: camera.snapshot
        continue_on_error: true
        target:
          entity_id: !input camera
        data:
          filename: "{{ photo }}"
  - sequence: !input photo_actions
