# The documentation website: MkDocs with the Material theme builds it from the pages
# in docs/, and the Docs workflow publishes it on GitHub Pages with every change of
# main. This file belongs to the project: the blueprint writes it once, and its
# updates leave it as it is. Preview the website while you write with
#   pip install --require-hashes -r .github/docs-requirements.txt && mkdocs serve
# https://squidfunk.github.io/mkdocs-material/
site_name: "Autodarts"
site_description: "Autodarts for Home Assistant: local realtime board control, X01, Cricket, party and training games, tournaments and a bot, player statistics with heatmaps, seven dashboard cards and twelve blueprints, games started by voice. No cloud account needed."
site_url: https://dennis-otto.github.io/ha-autodarts/
repo_url: https://github.com/Dennis-Otto/ha-autodarts
repo_name: Dennis-Otto/ha-autodarts
# The pencil on every page opens it for editing on GitHub.
edit_uri: edit/main/docs/
copyright: "© 2026 Trkal and HACSAutodarts contributors; 2026 Dennis Otto"
# Every page is a file next to the others, as on GitHub, so that a relative path in
# HTML, such as <img src="images/card.png">, leads to the same file in both places.
use_directory_urls: false

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  # Light or dark, as the reader's system prefers, with a switch in the header.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search:
      lang: [en, de]

# Links in the HTML of a page, such as those of the tables of the start pages,
# lead to the pages of the website, as the links of the Markdown do.
hooks:
  - scripts/mkdocs_hooks.py

# Markdown as GitHub shows it, so that every page reads the same on github.com.
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Anchors as GitHub makes them, so that links to a heading work in both places.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  # A page may include a file of the repository, such as the line
  # --8<-- "CHANGELOG.md", so that nothing is written twice.
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# A link or an anchor that leads nowhere, and a page outside the menu, fail the
# build; not_in_nav names the pages that are outside on purpose.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The menu, in the order of the start pages. German pages live under docs/de/ and
# form the section "Deutsch", which the language switch of extra.alternate below
# leads to.
nav:
  - Home: README.md
  - Get started:
      - getting-started.md
      - installation.md
  - Guides:
      - games.md
      - scoreboard.md
      - statistics.md
      - automations.md
      - online-matches.md
  - Reference:
      - cards.md
      - entities.md
      - how-it-works.md
      - troubleshooting.md
      - security.md
      - glossary.md
  - Project:
      - Changelog: https://github.com/Dennis-Otto/ha-autodarts/blob/main/CHANGELOG.md
      - roadmap.md
      - development.md
      - releases.md
      - creator-kit.md
  - Deutsch:
      - de/README.md
      - Erste Schritte:
          - de/erste-schritte.md
          - de/installation.md
      - Anleitungen:
          - de/spiele.md
          - de/anzeigetafel.md
          - de/statistik.md
          - de/automationen.md
          - de/online-matches.md
      - Referenz:
          - de/karten.md
          - de/entitaeten.md
          - de/funktionsweise.md
          - de/fehlerbehebung.md
          - de/sicherheit.md
          - de/glossar.md
      - Projekt:
          - de/roadmap.md
          - de/creator-kit.md

# Pages outside the menu on purpose: the decision records, which their table in
# decisions/README.md lists, the notes of guides that moved, which old links still
# reach, and the sources of the brand assets.
not_in_nav: |
  /decisions/
  /LOCAL-CONTROL.md
  /SETUP-DE.md
  /branding/

extra:
  alternate:
    - name: English
      link: /ha-autodarts/
      lang: en
    - name: Deutsch
      link: /ha-autodarts/de/
      lang: de
