[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# A hanging test fails instead of blocking the run, locally as in CI.
timeout = 30
# Warnings of the integration's own code are errors.
filterwarnings = ['error:::custom_components\.autodarts']
markers = [
    "expected_errors: the test logs errors of the integration on purpose",
    "mutation_unsafe: fails in mutmut's copy of the repository, which has no Git and holds every mutant in the code; skipped under mutmut",
]

# The weekly mutation tests (.github/workflows/mutation.yml) with mutmut. They change
# the modules of the game rules whose roughly 2,650 mutants one run reaches on the four
# cores of a runner; practice.py, drills.py and tournament.py, with about 5,900 more,
# join once the run is split into parts. See docs/development.md#mutation-tests.
[tool.mutmut]
source_paths = ["custom_components"]
only_mutate = [
    "custom_components/autodarts/bot.py",
    "custom_components/autodarts/checkout.py",
    "custom_components/autodarts/cricket.py",
    "custom_components/autodarts/doubles.py",
    "custom_components/autodarts/party.py",
    "custom_components/autodarts/positions.py",
    "custom_components/autodarts/scoring.py",
]
# mutmut runs the tests in its copy of the repository, mutants/, which gets the
# integration and every other file and folder of the repository that a test may read.
also_copy = [
    ".copier-answers.yml",
    ".devcontainer",
    ".editorconfig",
    ".gitattributes",
    ".githooks",
    ".github",
    ".gitignore",
    ".lycheeignore",
    ".markdownlint-cli2.jsonc",
    ".markdownlint.jsonc",
    ".pre-commit-config.yaml",
    ".python-version",
    ".release-please-manifest.json",
    ".vale.ini",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "GOVERNANCE.md",
    "LICENSE",
    "LICENSES",
    "README.md",
    "REUSE.toml",
    "SECURITY.md",
    "SUPPORT.md",
    "blueprints",
    "docs",
    "eslint.config.mjs",
    "hacs.json",
    "lychee.toml",
    "mkdocs.yml",
    "osv-scanner.toml",
    "package-lock.json",
    "package.json",
    "pyproject.toml",
    "release-please-config.json",
    "requirements-test.in",
    "requirements-test.txt",
    "scripts",
    "tests",
    "version.txt",
]

[tool.coverage.run]
branch = true
source = ["custom_components/autodarts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
# The settings tool of the blueprint, which the blueprint keeps current.
extend-exclude = [".github/blueprint.py"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/autodarts"]

# Home Assistant re-exports helpers such as StaticPathConfig without __all__.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true
