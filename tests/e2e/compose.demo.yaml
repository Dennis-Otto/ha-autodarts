# Overlay for tests/e2e/compose.yaml: a demo instance with password-less local login.
services:
  homeassistant:
    environment:
      DEMO_LANGUAGE: ${DEMO_LANGUAGE:-en}
    volumes:
      - ./demo.configuration.yaml:/config/configuration.yaml:ro
      # The blueprints of the repository, for the weekly report screenshot.
      - ../../blueprints/automation/autodarts:/config/blueprints/automation/autodarts:ro
