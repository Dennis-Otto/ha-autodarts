services:
  board-mock:
    # The Home Assistant image already provides aiohttp for the Board Manager double.
    image: ${HOME_ASSISTANT_IMAGE:-ghcr.io/home-assistant/home-assistant:2026.9.4@sha256:3e6710a7ab2a61311d9d899b719f6c3657791c63e8f4942cec4ebc42401d6b76}
    entrypoint: ["python3", "/e2e/board_mock.py"]
    environment:
      BOARD_MANAGER: ${BOARD_MANAGER:-1}
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./:/e2e:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3180/health')"]
      interval: 2s
      timeout: 2s
      retries: 30

  homeassistant:
    image: ${HOME_ASSISTANT_IMAGE:-ghcr.io/home-assistant/home-assistant:2026.9.4@sha256:3e6710a7ab2a61311d9d899b719f6c3657791c63e8f4942cec4ebc42401d6b76}
    depends_on:
      board-mock:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      BOARD_MANAGER: ${BOARD_MANAGER:-1}
    ports:
      - "127.0.0.1:${E2E_PORT:-18123}:8123"
    volumes:
      - homeassistant_config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
      - ../../custom_components/autodarts:/config/custom_components/autodarts:ro
      - ./:/e2e:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8123/api/onboarding >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 100

volumes:
  homeassistant_config:
