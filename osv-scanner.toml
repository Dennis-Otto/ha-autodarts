# Advisories that OSV-Scanner (and the OpenSSF Scorecard) should not report.
#
# An advisory goes here only for a dependency that just the test environment installs
# (requirements-test.txt), such as one that Home Assistant pins exactly; the integration
# itself ships no Python dependencies. Each entry is an [[IgnoredVulns]] table with the
# advisory's `id` and a `reason` that starts with the package and its pinned version
# ("cryptography 48.0.1: ..."), and tests/test_consistency.py fails once the test base
# moves past that version, so an entry leaves with the update that fixes it.
# .github/dependency-review.yml lists the same advisories under allow-ghsas.
#
# Home Assistant 2026.10 pins cryptography 50.0.1 and PyJWT 2.15.1, which fixed the
# advisories that the 2026.9 test base needed here, so there are none.
