blueprint:
  name: "Autodarts: start a game by voice"
  description: >-
    Starts a practice game when you tell Assist, for example "Start 501 for
    Alex and Sam", "Starte das Spiel Cricket für Alex und Sam", "Juega 501 para
    Alex y Sam", "Lance la partie Cricket pour Alex et Sam" or "Speel 501 voor
    Alex tegen de bot", in English, German, Spanish, French or Dutch. Assist
    answers with the game and the players, or with what was wrong, in the
    language of Home Assistant.


    In the sentences, `{game}` is the game and `{players}` the players.
    X01 is a number from 101 to 1001, as digits or as words in the language of
    Home Assistant, such as "five hundred one", "fünfhunderteins", "quinientos
    uno", "cinq cent un" or "vijfhonderdeen"; any other game follows the word
    "game", "Spiel", "partida", "partie" or "spel" and is named as the game
    list shows it, in any language of the integration, such as "Around the
    Clock" or "Doppeltraining". Players are named one word each, separated by
    "and", "und", "y", "et", "en" or a pause. Without players, the players stay
    as they are. A sentence that ends in "bot", such as "… for Alex and the
    bot", "… gegen den Bot", "… contra el bot", "… contre le bot" or "… tegen de
    bot", plays against the bot, which is never taken for a player.


    Assist hears these sentences before its own commands, so each needs a
    number or the word for a game: "Start a timer for 5 minutes" stays a
    timer.


    Sentences saved in an automation stay as they are: re-import the blueprint
    and leave the sentences at their default to get those of a new version.


    [Settings and examples in the guide](https://dennis-otto.github.io/ha-autodarts/automations.html#start-a-game-by-voice)
  domain: automation
  author: Dennis Otto
  source_url: https://github.com/Dennis-Otto/ha-autodarts/blob/main/blueprints/automation/autodarts/start_game_by_voice.yaml
  homeassistant:
    min_version: "2026.8.0"
  input:
    sentences:
      name: Sentences
      description: >-
        What you say to Assist. `{game}` is the game and `{players}` the
        players; parts in [brackets] are optional, (a|b) means a or b.
      default:
        - "(starte|spiele) [ein|eine] {101..1001,100:game} [(für|mit) {players}] gegen den Bot"
        - "(starte|spiele) [das|ein] Spiel {game} [(für|mit) {players}] gegen den Bot"
        - "(start|play) [a] {101..1001,100:game} [(for|with) {players}] against the bot"
        - "(start|play) [the|a] game [of] {game} [(for|with) {players}] against the bot"
        - "(empieza|inicia|juega) [un|una partida de] {101..1001,100:game} [(para|con) {players}] contra el bot"
        - "(empieza|inicia|juega) [la|una] partida [de] {game} [(para|con) {players}] contra el bot"
        - "(démarre|démarrez|lance|lancez|joue|jouez) [une partie de] {101..1001,100:game} [(pour|avec) {players}] contre le bot"
        - "(démarre|démarrez|lance|lancez|joue|jouez) [la|une] partie [de] {game} [(pour|avec) {players}] contre le bot"
        - "(start|speel) [een] {101..1001,100:game} [(voor|met) {players}] tegen de bot"
        - "(start|speel) [het|een] spel {game} [(voor|met) {players}] tegen de bot"
        - "(starte|spiele) [ein|eine] {101..1001,100:game} (für|mit) {players}"
        - "(starte|spiele) [das|ein] Spiel {game} (für|mit) {players}"
        - "(start|play) [a] {101..1001,100:game} (for|with) {players}"
        - "(start|play) [the|a] game [of] {game} (for|with) {players}"
        - "(empieza|inicia|juega) [un|una partida de] {101..1001,100:game} (para|con) {players}"
        - "(empieza|inicia|juega) [la|una] partida [de] {game} (para|con) {players}"
        - "(démarre|démarrez|lance|lancez|joue|jouez) [une partie de] {101..1001,100:game} (pour|avec) {players}"
        - "(démarre|démarrez|lance|lancez|joue|jouez) [la|une] partie [de] {game} (pour|avec) {players}"
        - "(start|speel) [een] {101..1001,100:game} (voor|met) {players}"
        - "(start|speel) [het|een] spel {game} (voor|met) {players}"
        - "(starte|spiele) [ein|eine] {101..1001,100:game}"
        - "(starte|spiele) [das|ein] Spiel {game}"
        - "(start|play) [a] {101..1001,100:game}"
        - "(start|play) [the|a] game [of] {game}"
        - "(empieza|inicia|juega) [un|una partida de] {101..1001,100:game}"
        - "(empieza|inicia|juega) [la|una] partida [de] {game}"
        - "(démarre|démarrez|lance|lancez|joue|jouez) [une partie de] {101..1001,100:game}"
        - "(démarre|démarrez|lance|lancez|joue|jouez) [la|une] partie [de] {game}"
        - "(start|speel) [een] {101..1001,100:game}"
        - "(start|speel) [het|een] spel {game}"
      selector:
        text:
          multiple: true
    bot_level:
      name: Bot level
      description: The 3-dart average the bot plays in X01 when a sentence ends in "bot".
      default: 60
      selector:
        number:
          min: 20
          max: 120
          step: 5
          mode: slider
    board:
      name: Board
      description: The Autodarts board to play on. Needed only with more than one board.
      default: ""
      selector:
        config_entry:
          integration: autodarts

mode: queued

triggers:
  - trigger: conversation
    command: !input sentences

variables:
  bot_level: !input bot_level
  board: !input board
  # A spoken number arrives as a number, a name as text.
  game: >-
    {% set spoken = trigger.slots.game %}
    {{ (spoken | int) if spoken is number else spoken }}
  # One name per word: the bot at the end, as in "Alex and the bot", is the bot,
  # and "und", "and" and the like only join the names.
  players: >-
    {{ (trigger.slots.players | default('', true))
       | regex_replace('(?i)(^| )((und|and|y|et|en|&) )?((the|a|an|der|den|dem|ein|einen|el|un|le|de|een|het) )?bot$', '')
       | regex_replace('(?i)(^| )(und|and|y|et|en|&)(?= |$)', ' ')
       | regex_findall('[^ ]+') }}
  bot: "{{ trigger.sentence is search('(^|[^a-z])bot[^a-z]*$', ignorecase=True) }}"

actions:
  - action: autodarts.start_game
    data: >-
      {{ dict(game=game, bot_level=(bot_level | int if bot else 0))
         | combine(dict(players=players) if players else {})
         | combine(dict(config_entry_id=board) if board else {}) }}
    response_variable: result
  - set_conversation_response: "{{ result.message }}"
